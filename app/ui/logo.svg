<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Setup Assistant logo">
  <title>Setup Assistant</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#0e1017"/>
    </linearGradient>
    <!-- Balance: understeer (blue) - neutral (white) - oversteer (orange) -->
    <linearGradient id="balance" x1="96" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb6ff"/>
      <stop offset="0.42" stop-color="#bfe6ff"/>
      <stop offset="0.5" stop-color="#f4f5fa"/>
      <stop offset="0.58" stop-color="#ffd1ad"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffae2e" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#ffae2e" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#ff3d4f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3d4f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Balance arc -->
  <path d="M 143 351 A 152 152 0 1 1 369 351" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="38" stroke-linecap="round"/>
  <path d="M 143 351 A 152 152 0 1 1 369 351" fill="none" stroke="url(#balance)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ticks -->
  <g stroke="#0e1017" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="92" x2="256" y2="124" transform="rotate(-90 256 250)"/>
    <line x1="256" y1="92" x2="256" y2="118" transform="rotate(-45 256 250)"/>
    <line x1="256" y1="92" x2="256" y2="128"/>
    <line x1="256" y1="92" x2="256" y2="118" transform="rotate(45 256 250)"/>
    <line x1="256" y1="92" x2="256" y2="124" transform="rotate(90 256 250)"/>
  </g>

  <!-- Needle, just right of neutral -->
  <g transform="rotate(8 256 250)">
    <path d="M 249 252 L 256 134 L 263 252 Z" fill="#f4f5fa"/>
    <path d="M 253.5 170 L 256 134 L 258.5 170 Z" fill="#ff6a2b"/>
  </g>
  <circle cx="256" cy="250" r="24" fill="#f4f5fa"/>
  <circle cx="256" cy="250" r="9" fill="#0e1017"/>

  <!-- Track elevation line -->
  <path d="M 96 410 C 140 410, 150 386, 190 388 S 236 420, 270 412 S 316 378, 350 384 S 396 404, 416 400"
        fill="none" stroke="url(#track)" stroke-width="9" stroke-linecap="round"/>
</svg>
